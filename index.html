<script>
// Page navigate karte waqt scroll position save karo
window.addEventListener('beforeunload', () => {
    sessionStorage.setItem('scrollPos', window.scrollY);
});

// Wapas aane par scroll position restore karo  
window.addEventListener('pageshow', () => {
    const pos = sessionStorage.getItem('scrollPos');
    if(pos) {
        setTimeout(() => {
            window.scrollTo(0, parseInt(pos));
            sessionStorage.removeItem('scrollPos');
        }, 100);
    }
});
</script>

  <script>
function toggleSettingMenu() {
    const drawer = document.getElementById('setting-drawer');
    const overlay = document.getElementById('setting-overlay');
    const isOpen = drawer.style.display === 'block';
    drawer.style.display = isOpen ? 'none' : 'block';
    overlay.style.display = isOpen ? 'none' : 'block';
}
  </script>
